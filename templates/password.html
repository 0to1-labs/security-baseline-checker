{% extends 'base.html' %}
{% block title %}修改密码 - 安全基线检查系统{% endblock %}
{% block content %}
<div class="card" style="max-width:420px">
<h1>修改登录密码</h1>
<form method="post">
  <label>旧密码</label><input name="old" type="password" required>
  <label>新密码</label><input name="new" type="password" required minlength="8">
  <div style="margin-top:14px"><button class="btn">保存</button></div>
  <div class="{{ 'ok' if msg == 'ok' else 'err' }}">{{ '密码已修改' if msg == 'ok' else msg }}</div>
</form>
</div>
{% endblock %}
